<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2a4f">
<title>WPBL — Wall Pickleball League</title>

<style>
:root{
  --navy:#0d2a4f;
  --blue:#1459a6;
  --red:#d8242f;
  --bg:#f4f7fb;
  --card:#fff;
  --text:#172033;
  --muted:#6b7485;
  --line:#dfe5ee;
  --ok:#147d4b;
  --warn:#a35a00
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text)
}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}

.app{min-height:100vh}
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:var(--navy);
  color:#fff;
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 2px 12px #0002
}
.logo{
  width:54px;
  height:36px;
  object-fit:contain;
  border-radius:6px
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  flex:1
}
.brand strong{font-size:19px}
.brand small{display:block;opacity:.8}

.top-actions{display:flex;gap:8px}
.iconbtn{
  background:#ffffff18;
  border:1px solid #ffffff33;
  color:#fff;
  border-radius:10px;
  padding:9px 11px
}

.control{
  background:#fff;
  border-bottom:1px solid var(--line);
  padding:10px 14px;
  display:flex;
  gap:10px;
  align-items:center;
  overflow:auto;
  position:sticky;
  top:57px;
  z-index:15
}
.control label{
  font-size:12px;
  color:var(--muted)
}

select,input,textarea{
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px;
  background:#fff;
  color:var(--text)
}
select{min-width:130px}

.main{
  max-width:980px;
  margin:0 auto;
  padding:16px 14px 88px
}

.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:#fff;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  z-index:30;
  padding-bottom:env(safe-area-inset-bottom)
}
.nav button{
  border:0;
  background:#fff;
  padding:10px 4px 8px;
  color:#657087;
  font-size:11px
}
.nav button.active{
  color:var(--blue);
  font-weight:700
}
.nav span{
  display:block;
  font-size:20px;
  margin-bottom:2px
}

h1{font-size:25px;margin:2px 0 4px}
h2{font-size:19px;margin:0 0 12px}
h3{font-size:16px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 16px}

.grid{display:grid;gap:12px}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:680px){
  .grid2,.grid3{grid-template-columns:1fr}
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:15px;
  box-shadow:0 3px 14px #17315a0a;
  margin-bottom:12px
}
.hero{
  background:linear-gradient(135deg,var(--navy),#173e72);
  color:#fff;
  border:0
}
.hero .sub{color:#dce8fa}

.btn{
  border:0;
  border-radius:11px;
  padding:10px 13px;
  font-weight:700;
  background:var(--blue);
  color:#fff
}
.btn.red{background:var(--red)}
.btn.ghost{background:#eef3f9;color:var(--navy)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:7px 9px;font-size:13px}

.row{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap
}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:9px}

.badge{
  display:inline-block;
  border-radius:999px;
  padding:5px 9px;
  font-size:12px;
  font-weight:700;
  background:#eaf1fb;
  color:var(--blue)
}
.badge.red{background:#fdecef;color:var(--red)}
.badge.ok{background:#e9f7f0;color:var(--ok)}
.badge.warn{background:#fff2df;color:var(--warn)}

.item{
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px;
  background:#fff
}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.right{text-align:right}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px
}
th,td{
  padding:9px 7px;
  border-bottom:1px solid var(--line);
  text-align:left
}
th{
  color:var(--muted);
  font-size:12px
}
.tablewrap{overflow:auto}

.game{border-left:5px solid var(--blue)}
.game.current{
  border-left-color:var(--red);
  box-shadow:0 0 0 2px #d8242f18
}
.game.done{opacity:.72}
.game.pending{border-left-color:#e1a100}

.scoreline{font-size:22px;font-weight:800}
.vs{
  font-size:12px;
  color:var(--muted);
  font-weight:700
}

.tabs{
  display:flex;
  gap:6px;
  overflow:auto;
  margin:0 0 12px
}
.tabs button{
  white-space:nowrap;
  border:1px solid var(--line);
  border-radius:999px;
  background:#fff;
  padding:7px 11px
}
.tabs button.active{
  background:var(--navy);
  color:#fff
}

.modalback{
  position:fixed;
  inset:0;
  background:#06152bcc;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  z-index:80
}
.modal{
  width:min(680px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:20px 20px 0 0;
  padding:18px
}

.auth{
  min-height:100vh;
  background:linear-gradient(135deg,#0d2a4f,#164e8d);
  display:grid;
  place-items:center;
  padding:20px
}
.authbox{
  background:#fff;
  width:min(440px,100%);
  border-radius:20px;
  padding:22px;
  text-align:center
}
.authlogo{
  width:180px;
  max-height:120px;
  object-fit:contain
}

.notice{
  padding:10px 12px;
  border-radius:10px;
  background:#eef5ff;
  color:#174d85;
  font-size:13px
}
.notice.warn{
  background:#fff3df;
  color:#8a4e00
}
.notice.ok{
  background:#eaf8f0;
  color:#17623e
}

textarea{
  width:100%;
  min-height:90px;
  resize:vertical
}
.field{
  display:flex;
  flex-direction:column;
  gap:5px
}
.field label{
  font-size:12px;
  color:var(--muted);
  font-weight:600
}
.field input,.field select{width:100%}

.pollopt{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px;
  border:1px solid var(--line);
  border-radius:10px
}
.thread-title{font-weight:800}
.comment{
  padding:8px 0;
  border-top:1px solid var(--line)
}

.bracket{
  display:grid;
  gap:10px
}
.matchup{
  padding:11px;
  border:1px solid var(--line);
  border-radius:12px
}
.seed{
  font-size:11px;
  color:var(--muted);
  margin-right:4px
}

hr{
  border:0;
  border-top:1px solid var(--line);
  margin:14px 0
}
.danger{color:var(--red)}
</style>
</head>

<body>

<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL="https://trujrwhkkjepyorpvjjr.supabase.co";
const SUPABASE_KEY="sb_publishable_RcP9-stV689diug__RIZkg_g5agpSNR";

const sb=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const LOGO="https://asnehpets.github.io/GLOAT-League/wpbl-logo.png";

const KEY="wpbl_state_secure_v3";

const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];

const uid=(p="id")=>
  p+"_"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);

const esc=s=>
  String(s??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[m]));

const fmtTime=d=>
  new Date(d).toLocaleTimeString([],{
    hour:"numeric",
    minute:"2-digit"
  });

const fmtDate=d=>
  new Date(d+"T12:00:00").toLocaleDateString([],{
    month:"short",
    day:"numeric",
    year:"numeric"
  });

const addMin=(d,m)=>
  new Date(new Date(d).getTime()+m*60000).toISOString();

const today=()=>new Date().toISOString().slice(0,10);

function fresh(adminId,adminName,adminEmail){
  const admin={
    id:adminId,
    name:adminName||"Stephen",
    email:adminEmail||"",
    role:"admin",
    active:true,
    sub:false
  };

  const season={
    id:"s1",
    name:"Fall 2026",
    format:"individual",
    status:"active",
    gameDay:today(),
    startTime:"18:00",
    gamesPerPair:2,
    target:11,
    winBy:2,
    bestOf:1,
    rsvpDays:2,
    playoffs:true,
    playoffQualifiers:4,
    players:[admin.id],
    weeks:[]
  };

  return{
    version:3,
    players:[admin],
    seasons:[season],
    activeSeason:"s1",
    board:[],
    audit:[],
    settings:{
      gameMinutes:18,
      globalBoard:true
    }
  };
}

let state=null;
let currentView="home";
let session="";
let authSession=null;

function load(){
  try{
    const x=localStorage.getItem(KEY);
    return x?JSON.parse(x):null;
  }catch(e){
    return null;
  }
}

function save(){
  localStorage.setItem(KEY,JSON.stringify(state));
}

function me(){
  return state?.players?.find(p=>p.id===session);
}

function season(){
  return state?.seasons?.find(s=>s.id===state.activeSeason)
    ||state?.seasons?.[0];
}

function week(){
  const s=season();
  if(!s)return null;

  return s.weeks.find(w=>w.id===s.activeWeek)
    ||s.weeks.at(-1)
    ||null;
}

function player(id){
  return state.players.find(p=>p.id===id);
}

function pname(id){
  return player(id)?.name||"Unknown";
}

function isAdmin(){
  return me()?.role==="admin";
}

function log(action){
  state.audit.unshift({
    at:new Date().toISOString(),
    by:me()?.name||"System",
    action
  });

  state.audit=state.audit.slice(0,100);
  save();
}

function toast(msg){
  const el=$("#toast");

  if(!el){
    alert(msg);
    return;
  }

  el.textContent=msg;
  el.style.opacity=1;

  setTimeout(()=>{
    el.style.opacity=0;
  },1800);
}

function deadlineFor(s,w){
  const d=new Date(
    (w.date||s.gameDay)+"T"+(s.startTime||"18:00")
  );

  d.setDate(
    d.getDate()-(s.rsvpDays||2)
  );

  return d;
}

function isLocked(s,w){
  return new Date()>deadlineFor(s,w)
    &&!w.rsvpReopened;
}

async function boot(){
  try{
    const {
      data:{session:s}
    }=await sb.auth.getSession();

    authSession=s;
    session=s?.user?.id||"";

    if(!session){
      renderAuth();
      return;
    }

    const {
      data:profile,
      error
    }=await sb
      .from("profiles")
      .select("*")
      .eq("id",session)
      .single();

    if(error){
      document.getElementById("root").innerHTML=`
        <div class="auth">
          <div class="authbox">
            <img class="authlogo" src="${LOGO}">
            <h1>WPBL</h1>
            <p>${esc(error.message)}</p>
            <button class="btn" onclick="logout()">Sign out</button>
          </div>
        </div>
      `;
      return;
    }

    state=load();

    if(!state){
      state=fresh(
        session,
        profile.name||"Stephen",
        profile.email||s.user.email||""
      );
      save();
    }

    let current=state.players.find(
      p=>p.id===session
    );

    if(!current){
      state.players.push({
        id:session,
        name:profile.name||"Stephen",
        email:profile.email||s.user.email||"",
        role:profile.role||"member",
        active:true,
        sub:profile.is_substitute||false
      });

      if(
        season()
        &&!season().players.includes(session)
      ){
        season().players.push(session);
      }

      save();
    }else{
      current.name=
        profile.name||current.name;

      current.email=
        profile.email||
        s.user.email||
        current.email;

      current.role=
        profile.role||current.role;

      current.sub=
        profile.is_substitute??
        current.sub;

      save();
    }

    render();

  }catch(err){
    console.error(err);

    document.getElementById("root").innerHTML=`
      <div class="auth">
        <div class="authbox">
          <h1>WPBL</h1>
          <p>Something went wrong loading WPBL.</p>
          <p class="tiny muted">${esc(err.message||err)}</p>
        </div>
      </div>
    `;
  }
}

sb.auth.onAuthStateChange(
  async(_event,s)=>{
    authSession=s;
    session=s?.user?.id||"";

    if(session){
      await boot();
    }else{
      renderAuth();
    }
  }
);

async function sendMagicLink(){
  const email=
    $("#loginEmail")
    ?.value
    ?.trim()
    .toLowerCase();

  const msg=$("#authMsg");

  if(!email){
    msg.textContent="Enter your email.";
    return;
  }

  msg.textContent="Sending...";

  const {error}=
    await sb.auth.signInWithOtp({
      email,
      options:{
        shouldCreateUser:false,
        emailRedirectTo:
          "https://asnehpets.github.io/GLOAT-League/wpbl-test.html"
      }
    });

  if(error){
    msg.textContent=error.message;
    return;
  }

  msg.textContent=
    "Check your email for the secure WPBL sign-in link.";
}

async function logout(){
  await sb.auth.signOut();
  session="";
  renderAuth();
}

function renderAuth(){
  document.getElementById("root").innerHTML=`
    <div class="auth">
      <div class="authbox">

        <img
          class="authlogo"
          src="${LOGO}"
          alt="WPBL"
        >

        <h1>WPBL</h1>

        <p class="sub">
          Wall Pickleball League
        </p>

        <div class="notice">
          Invite-only league.
          Sign in with the email address
          invited by the commissioner.
        </div>

        <br>

        <div class="field">
          <label>Email</label>

          <input
            id="loginEmail"
            type="email"
            autocomplete="email"
            inputmode="email"
            placeholder="you@example.com"
          >
        </div>

        <br>

        <button
          class="btn"
          style="width:100%"
          onclick="sendMagicLink()"
        >
          Email me a secure sign-in link
        </button>

        <p
          id="authMsg"
          class="tiny muted"
        ></p>

      </div>
    </div>
  `;
}

function render(){
  if(!session||!me()){
    renderAuth();
    return;
  }

  const s=season();

  document.getElementById("root").innerHTML=`
    <div class="app">

      <header class="topbar">

        <div class="brand">
          <img
            class="logo"
            src="${LOGO}"
            alt="WPBL"
          >

          <div>
            <strong>WPBL</strong>
            <small>Wall Pickleball League</small>
          </div>
        </div>

        <div class="top-actions">
          <button
            class="iconbtn"
            onclick="go('board')"
          >💬</button>

          <button
            class="iconbtn"
            onclick="go('profile')"
          >👤</button>
        </div>

      </header>

      <div class="control">

        <label>
          League / Season<br>

          <select id="seasonSel">
            ${state.seasons.map(x=>`
              <option
                value="${x.id}"
                ${x.id===state.activeSeason?"selected":""}
              >
                ${esc(x.name)}
              </option>
            `).join("")}
          </select>
        </label>

        ${
          s
          ?`
            <span class="badge ${s.format==="individual"?"":"red"}">
              ${
                s.format==="individual"
                ?"Rotating Partners"
                :"Fixed Teams"
              }
            </span>
          `
          :""
        }

      </div>

      <main
        id="main"
        class="main"
      ></main>

      <nav class="nav">

        ${navbtn("home","⌂","Home")}
        ${navbtn("schedule","▣","Schedule")}
        ${navbtn("live","▶","Live")}
        ${navbtn("standings","★","Standings")}
        ${navbtn("more","☰","More")}

      </nav>

      <div id="modalRoot"></div>

      <div
        id="toast"
        style="
          position:fixed;
          left:50%;
          bottom:80px;
          transform:translateX(-50%);
          background:#172033;
          color:#fff;
          padding:9px 13px;
          border-radius:999px;
          z-index:100;
          opacity:0;
          transition:.2s
        "
      ></div>

    </div>
  `;

  $("#seasonSel").onchange=e=>{
    state.activeSeason=e.target.value;
    save();
    render();
  };

  renderView();
}

function navbtn(v,i,l){
  return`
    <button
      onclick="go('${v}')"
      class="${currentView===v?"active":""}"
    >
      <span>${i}</span>
      ${l}
    </button>
  `;
}

function go(v){
  currentView=v;
  renderView();

  $$(".nav button").forEach(b=>{
    b.classList.toggle(
      "active",
      b.getAttribute("onclick")
        ?.includes(`'${v}'`)
    );
  });
}

function renderView(){
  const el=$("#main");
  if(!el)return;

  const views={
    home:homeView,
    schedule:scheduleView,
    live:liveView,
    standings:standingsView,
    board:boardView,
    more:moreView,
    profile:profileView,
    admin:adminView,
    playoffs:playoffsView
  };

  const fn=
    views[currentView]
    ||homeView;

  fn(el);
}

function homeView(el){
  const s=season();
  const w=week();

  const mine=
    w?.availability?.[me().id];

  const cur=
    w?.games?.find(
      g=>g.status!=="confirmed"
    );

  el.innerHTML=`

    <h1>${esc(s?.name||"WPBL")}</h1>

    <p class="sub">
      ${
        s?.format==="individual"
        ?"Individual standings • weekly rotating partners"
        :"Fixed-team league"
      }
    </p>

    <div class="card hero">

      <h2>
        ${
          w
          ?`Week ${w.number} — ${fmtDate(w.date)}`
          :"Season ready"
        }
      </h2>

      <p class="sub">
        ${
          w
          ?`RSVP deadline: ${
              deadlineFor(s,w)
              .toLocaleString([],{
                month:"short",
                day:"numeric",
                hour:"numeric",
                minute:"2-digit"
              })
            }`
          :"Admin can create the first week when ready."
        }
      </p>

      ${
        w
        ?`
          <div class="row">

            <button
              class="btn ${mine==="in"?"ok":"ghost"}"
              onclick="rsvp('in')"
            >
              ✓ Playing
            </button>

            <button
              class="btn ${mine==="out"?"red":"ghost"}"
              onclick="rsvp('out')"
            >
              ✕ Not Playing
            </button>

          </div>
        `
        :""
      }

    </div>

    ${
      cur
      ?`
        <div class="card">

          <div class="row between">
            <h2>Current / Next Game</h2>

            <span class="badge red">
              ${
                cur.status==="pending"
                ?"Awaiting confirmation"
                :"Up next"
              }
            </span>
          </div>

          ${gameSummary(cur,w)}

          <button
            class="btn"
            onclick="go('live')"
          >
            Open Live Game
          </button>

        </div>
      `
      :""
    }

    <div class="grid grid2">

      <div class="card">

        <h3>Standings</h3>

        ${topStandings(4)}

        <button
          class="btn ghost sm"
          onclick="go('standings')"
        >
          Full standings
        </button>

      </div>

      <div class="card">

        <h3>League Board</h3>

        ${
          state.board.length
          ?state.board
            .slice(0,3)
            .map(t=>`
              <div class="item">
                <b>${esc(t.title)}</b>
                <div class="tiny muted">
                  ${t.comments.length} comments
                </div>
              </div>
            `).join("")
          :`<p class="muted">No posts yet.</p>`
        }

        <button
          class="btn ghost sm"
          onclick="go('board')"
        >
          Open message board
        </button>

      </div>

    </div>
  `;
}

function rsvp(v){
  const s=season();
  const w=week();

  if(!w)return;

  if(isLocked(s,w)&&!isAdmin()){
    toast("RSVP is locked");
    return;
  }

  w.availability=
    w.availability||{};

  w.availability[me().id]=v;

  save();
  renderView();
}

function gameSummary(g,w){
  return`
    <div class="row between">

      <div>

        <b>
          ${g.teamA.map(pname).join(" & ")}
        </b>

        <div class="vs">
          VS
        </div>

        <b>
          ${g.teamB.map(pname).join(" & ")}
        </b>

      </div>

      <div class="right">

        <div class="tiny muted">
          ${
            g.estimate
            ?fmtTime(g.estimate)
            :""
          }
        </div>

        ${
          g.score
          ?`
            <div class="scoreline">
              ${g.score.a}–${g.score.b}
            </div>
          `
          :""
        }

      </div>

    </div>

function generateSchedule(){
  const s=season();
  const w=week();

  if(!w)return;

  const ids=
    s.players.filter(
      id=>
        (w.availability||{})[id]!=="out"
        &&player(id)?.active
    );

  if(ids.length<4){
    toast(
      "Need at least 4 available players"
    );
    return;
  }

  let pairings=[];

  if(s.format==="individual"){
    pairings=
      bestPairs(ids,s,w);
  }else{
    const teams=
      (s.teams||[])
      .filter(
        t=>t.every(id=>ids.includes(id))
      );

    if(teams.length<2){
      toast(
        "Set at least 2 available teams in Admin"
      );
      return;
    }

    for(let i=0;i<teams.length;i++){
      for(let j=i+1;j<teams.length;j++){
        pairings.push([
          teams[i],
          teams[j]
        ]);
      }
    }
  }

  let games=[];

  const target=
    Math.max(
      1,
      s.gamesPerPair||1
    );

  if(s.format==="individual"){
    const teams=pairings;
    let all=[];

    for(let i=0;i<teams.length;i++){
      for(let j=i+1;j<teams.length;j++){
        all.push([
          teams[i],
          teams[j]
        ]);
      }
    }

    all=
      sortOpponentVariety(
        all,
        s
      );

    for(let k=0;k<target;k++){
      games.push(...all);
    }
  }else{
    for(let k=0;k<target;k++){
      games.push(...pairings);
    }
  }

  games=
    orderForRest(games);

  w.games=
    games.map(x=>({
      id:uid("g"),
      teamA:x[0],
      teamB:x[1],
      status:"scheduled",
      score:null,
      submittedBy:null,
      confirmedBy:null,
      estimate:null
    }));

  w.partners={};

  if(s.format==="individual"){
    pairings.forEach(t=>{
      t.forEach(id=>{
        w.partners[id]=
          t.filter(x=>x!==id);
      });
    });
  }

  recalcTimes(w);

  save();

  log(
    `Generated Week ${w.number} schedule`
  );

  renderView();

  toast("Schedule generated");
}

function pairHistory(s,a,b){
  let c=0;

  s.weeks.forEach(w=>{
    const p=w.partners||{};

    if(
      (p[a]||[]).includes(b)
    ){
      c++;
    }
  });

  return c;
}

function bestPairs(ids,s,w){
  let remaining=[...ids];
  const teams=[];

  while(remaining.length>=2){

    const a=
      remaining.shift();

    const choices=
      remaining
      .map(b=>({
        b,
        c:pairHistory(s,a,b),
        r:Math.random()
      }))
      .sort(
        (x,y)=>
          x.c-y.c
          ||x.r-y.r
      );

    const b=
      choices[0].b;

    remaining=
      remaining.filter(x=>x!==b);

    teams.push([a,b]);
  }

  return teams;
}

function oppCount(s,t1,t2){
  const set1=
    new Set(t1);

  const set2=
    new Set(t2);

  let c=0;

  s.weeks.forEach(w=>
    (w.games||[])
    .filter(
      g=>g.status==="confirmed"
    )
    .forEach(g=>{

      const A=
        new Set(g.teamA);

      const B=
        new Set(g.teamB);

      if(
        (
          [...set1].some(x=>A.has(x))
          &&
          [...set2].some(x=>B.has(x))
        )
        ||
        (
          [...set1].some(x=>B.has(x))
          &&
          [...set2].some(x=>A.has(x))
        )
      ){
        c++;
      }
    })
  );

  return c;
}

function sortOpponentVariety(all,s){
  return all
    .map(x=>({
      x,
      c:oppCount(s,x[0],x[1]),
      r:Math.random()
    }))
    .sort(
      (a,b)=>
        a.c-b.c
        ||a.r-b.r
    )
    .map(z=>z.x);
}

function orderForRest(games){
  let rem=[...games];
  const out=[];
  let lastPlayers=new Set();

  while(rem.length){

    let idx=
      rem.findIndex(
        x=>
          ![
            ...x[0],
            ...x[1]
          ].some(
            p=>lastPlayers.has(p)
          )
      );

    if(idx<0){
      idx=0;
    }

    const g=
      rem.splice(idx,1)[0];

    out.push(g);

    lastPlayers=
      new Set([
        ...g[0],
        ...g[1]
      ]);
  }

  return out;
}

function recalcTimes(w){
  const s=season();

  const start=
    new Date(
      `${w.date}T${s.startTime||"18:00"}`
    );

  (w.games||[])
  .forEach((g,i)=>{
    g.estimate=
      addMin(
        start,
        i*(state.settings.gameMinutes||18)
      );
  });
}

function recalcTimesFromActual(w){
  const idx=
    nextGameIndex(w);

  const base=
    new Date();

  for(
    let i=idx;
    i<w.games.length;
    i++
  ){
    w.games[i].estimate=
      addMin(
        base,
        (i-idx)
        *(state.settings.gameMinutes||18)
      );
  }
}

function standingsData(){
  const s=season();

  const rows={};

  s.players.forEach(id=>{
    rows[id]={
      id,
      w:0,
      l:0,
      gp:0,
      pf:0,
      pa:0,
      pd:0,
      h2h:{}
    };
  });

  s.weeks.forEach(w=>
    (w.games||[])
    .filter(
      g=>g.status==="confirmed"
    )
    .forEach(g=>{

      const aWin=
        g.score.a>g.score.b;

      g.teamA.forEach(id=>{

        if(!rows[id])return;

        rows[id].gp++;
        rows[id].pf+=g.score.a;
        rows[id].pa+=g.score.b;

        if(aWin){
          rows[id].w++;
        }else{
          rows[id].l++;
        }

        g.teamB.forEach(o=>{
          rows[id].h2h[o]=
            (rows[id].h2h[o]||0)
            +(aWin?1:-1);
        });

      });

      g.teamB.forEach(id=>{

        if(!rows[id])return;

        rows[id].gp++;
        rows[id].pf+=g.score.b;
        rows[id].pa+=g.score.a;

        if(aWin){
          rows[id].l++;
        }else{
          rows[id].w++;
        }

        g.teamA.forEach(o=>{
          rows[id].h2h[o]=
            (rows[id].h2h[o]||0)
            +(aWin?-1:1);
        });

      });

    })
  );

  const arr=
    Object.values(rows)
    .map(r=>({
      ...r,
      pct:r.gp
        ?r.w/r.gp
        :0,
      pd:r.pf-r.pa
    }));

  arr.sort(
    (a,b)=>
      b.pct-a.pct
      ||headToHead(a,b)
      ||b.pd-a.pd
      ||b.w-a.w
      ||pname(a.id)
        .localeCompare(pname(b.id))
  );

  return arr;
}

function headToHead(a,b){
  return(
    (b.h2h[a.id]||0)
    -(a.h2h[b.id]||0)
  );
}

            ${esc(t.author)}
            •
            ${new Date(t.at).toLocaleString()}
          </div>

        </div>

        ${
          isAdmin()
          ?`
            <button
              class="btn ghost sm danger"
              onclick="deleteThread('${t.id}')"
            >
              Delete
            </button>
          `
          :""
        }

      </div>

      <p>
        ${esc(t.body)}
      </p>

      ${
        t.poll
        ?`

          <div class="stack">

            ${
              t.poll.options.map((o,i)=>`

                <button
                  class="pollopt"
                  onclick="vote('${t.id}',${i})"
                >

                  <span>○</span>

                  <span
                    style="
                      flex:1;
                      text-align:left
                    "
                  >
                    ${esc(o)}
                  </span>

                  <b>
                    ${votes[i]}
                  </b>

                </button>

              `).join("")
            }

          </div>

        `
        :""
      }

      <div>

        ${
          t.comments.map(c=>`

            <div class="comment">

              <b>
                ${esc(c.author)}
              </b>

              <span class="tiny muted">
                ${new Date(c.at).toLocaleString()}
              </span>

              <div>
                ${esc(c.body)}
              </div>

            </div>

          `).join("")
        }

      </div>

      <div class="row">

        <input
          id="c_${t.id}"
          style="flex:1"
          placeholder="Add a comment"
        >

        <button
          class="btn ghost sm"
          onclick="comment('${t.id}')"
        >
          Reply
        </button>

      </div>

    </div>
  `;
}

function newThread(){
  modal(`

    <h2>
      New Board Post
    </h2>

    <div class="stack">

      <div class="field">

        <label>
          Title
        </label>

        <input id="tt">

      </div>

      <div class="field">

        <label>
          Post
        </label>

        <textarea id="tb"></textarea>

      </div>

      <label>
        <input
          id="isPoll"
          type="checkbox"
        >
        Add poll
      </label>

      <div class="field">

        <label>
          Poll options
          (one per line)
        </label>

        <textarea
          id="po"
          placeholder="Option 1&#10;Option 2"
        ></textarea>

      </div>

      <button
        class="btn"
        onclick="saveThread()"
      >
        Post
      </button>

    </div>
  `);
}

function saveThread(){
  const title=
    $("#tt").value.trim();

  const body=
    $("#tb").value.trim();

  if(!title){
    toast("Add a title");
    return;
  }

  const is=
    $("#isPoll").checked;

  const opts=
    $("#po").value
    .split("\n")
    .map(x=>x.trim())
    .filter(Boolean);

  state.board.unshift({
    id:uid("t"),
    title,
    body,
    author:me().name,
    authorId:me().id,
    at:new Date().toISOString(),
    comments:[],
    poll:
      is&&opts.length>=2
      ?{
        options:opts,
        votes:{}
      }
      :null
  });

  save();
  closeModal();
  renderView();
}

function comment(id){
  const t=
    state.board.find(
      x=>x.id===id
    );

  const v=
    $("#c_"+id).value.trim();

  if(!v)return;

  t.comments.push({
    id:uid("c"),
    author:me().name,
    authorId:me().id,
    body:v,
    at:new Date().toISOString()
  });

  save();
  renderView();
}

function vote(id,i){
  const t=
    state.board.find(
      x=>x.id===id
    );

  t.poll.votes[me().id]=i;

  save();
  renderView();
}

function deleteThread(id){
  if(
    !confirm(
      "Delete this thread?"
    )
  ){
    return;
  }

  state.board=
    state.board.filter(
      x=>x.id!==id
    );

  save();
  renderView();
}

function adminView(el){
  if(!isAdmin()){
    go("home");
    return;
  }

  const s=season();

  el.innerHTML=`

    <div class="row between">

      <div>

        <h1>Admin</h1>

        <p class="sub">
          League settings and overrides
        </p>

      </div>

      <button
        class="btn"
        onclick="newSeason()"
      >
        New Season
      </button>

    </div>

    <div class="tabs">

      <button class="active">
        Season
      </button>

      <button

        Players
      </button>

      <h2>
        ${esc(s.name)}

      <div class="grid grid2">

              "Individual / rotating partners"
            ],
            [
              "fixed",

            ]

          1,

        ${fieldNum(

        ${fieldNum(
          "RSVP deadline (days before)",

          s.rsvpDays,

          14
        )}

          5,

          </select>

        </div>

      </div>

      <br>

      <button
        class="btn"
        onclick="saveAdminSettings()"

        Save Settings

    </div>

    <div class="card">

      <h3>
        Prototype data
      </h3>

      <p class="tiny muted">
        Login is secure through Supabase.
        League data is still stored locally
        during this testing stage.
      </p>

    </div>
  `;
}

function fieldSel(l,id,v,ops){
  return`

    <div class="field">

      <label>
        ${l}
      </label>

      <select id="${id}">

        ${
          ops.map(o=>`

            <option
              value="${o[0]}"
              ${v===o[0]?"selected":""}
            >
              ${o[1]}
            </option>

          `).join("")
        }

      </select>

    </div>
  `;
}

function fieldNum(
  l,
  id,
  v,
  min,
  max
){
  return`

    <div class="field">

      <label>
        ${l}
      </label>

      <input
        id="${id}"
        type="number"
        min="${min}"
        max="${max}"
        value="${v}"
      >

    </div>
  `;
}

function saveAdminSettings(){
  const s=season();

  s.format=
    $("#af").value;

  s.gamesPerPair=
    +$("#ag").value;

  s.target=
    +$("#at").value;

  s.winBy=
    +$("#awb").value;

  s.rsvpDays=
    +$("#ard").value;

  s.playoffs=
    $("#apo").value==="1";

  s.playoffQualifiers=
    +$("#apq").value;

  state.settings.gameMinutes=
    +$("#agm").value;

  save();

  log(
    "Updated league settings"
  );

  renderView();
  toast("Saved");
}

function adminPlayers(){
  const s=season();

  $("#main").innerHTML=`

    <div class="row between">

      <div>

        <h1>Players</h1>

        <p class="sub">
          Invite-only roster
        </p>

      </div>

      <div class="row">

        <button
          class="btn ghost"
          onclick="go('admin')"

          Back

    </div>

    <div class="card">

      ${
        state.players.map(p=>`

          <div class="item row between">

            <div>

              <b>
                ${esc(p.name)}
              </b>

                ${esc(p.email||"")}
                •
                ${p.role}
              </div>

            </div>

            <div class="row">

              <button
                class="btn ghost sm"
                onclick="toggleSeasonPlayer('${p.id}')"
              >
                ${

        `).join("")
      }

  `;
}

function invitePlayer(){
  modal(`

    <h2>
      Invite Player
    </h2>

    <div class="stack">

      <div class="field">

        <label>
          Name
        </label>

        <input id="pn">

      </div>

      <div class="field">

        <label>
          Email
        </label>

        <input
          id="pe"
          type="email"
        >

      </div>

      <label>

        <input
          id="ps"
          type="checkbox"
        >

        Substitute pool

      </label>

      <button
        class="btn"
        onclick="saveInvite()"
      >
        Add Test Player
      </button>

    </div>
  `);
}

function saveInvite(){
  const n=
    $("#pn").value.trim();

  const e=
    $("#pe").value.trim();

  if(!n){
    toast("Name required");
    return;
  }

  const p={
    id:uid("p"),
    name:n,
    email:e,
    role:"member",
    active:true,
    sub:$("#ps").checked
  };

  state.players.push(p);

  season().players.push(p.id);

  save();
  closeModal();
  adminPlayers();

  toast(
    "Test player added"
  );
}

function toggleSeasonPlayer(id){
  const s=season();

  s.players=
    s.players.includes(id)
    ?s.players.filter(x=>x!==id)
    :[...s.players,id];

  save();
  adminPlayers();
}

function toggleAdmin(id){
  const p=player(id);

  p.role=
    p.role==="admin"
    ?"member"
    :"admin";

  save();
  adminPlayers();
}

function newSeason(){
  modal(`

    <h2>
      New League / Season
    </h2>

    <div class="stack">

      <div class="field">

        <label>
          Name
        </label>

        <input
          id="sn"
          placeholder="Winter 2027"
        >

      </div>

      ${fieldSel(
        "Format",
        "sf",
        "individual",
        [
          [
            "individual",
            "Individual / rotating partners"
          ],
          [
            "fixed",
            "Fixed teams"
          ]
        ]
      )}

      <button
        class="btn"
        onclick="saveSeason()"
      >
        Create
      </button>

    </div>
  `);
}

function saveSeason(){
  const n=
    $("#sn").value.trim();

  if(!n)return;

  const s={
    id:uid("s"),
    name:n,
    format:$("#sf").value,
    status:"active",
    gameDay:today(),
    startTime:"18:00",
    gamesPerPair:2,
    target:11,
    winBy:2,
    bestOf:1,
    rsvpDays:2,
    playoffs:true,
    playoffQualifiers:4,
    players:
      state.players
      .filter(p=>p.active)
      .map(p=>p.id),
    weeks:[]
  };

  state.seasons.push(s);
  state.activeSeason=s.id;

  save();
  closeModal();
  render();
}

function modal(content){
  $("#modalRoot").innerHTML=`

    <div
      class="modalback"
      onclick="
        if(event.target===this)
        closeModal()
      "
    >

      <div class="modal">

        <div class="row between">

          <span></span>

          <button
            class="btn ghost sm"
            onclick="closeModal()"
          >
            Close
          </button>

        </div>

        ${content}

      </div>

    </div>
  `;
}

function closeModal(){
  $("#modalRoot").innerHTML="";
}

boot();
</script>
