<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WPBL Login Test</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0d2a4f;margin:0;padding:24px}
    .box{max-width:420px;margin:60px auto;background:white;padding:24px;border-radius:18px}
    h1{margin-top:0}
    input,button{width:100%;box-sizing:border-box;padding:12px;margin-top:10px;border-radius:10px;font-size:16px}
    input{border:1px solid #ccc}
    button{border:0;background:#1459a6;color:white;font-weight:700}
    #msg{margin-top:14px;color:#555}
  </style>
</head>
<body>

<div class="box">
  <h1>WPBL</h1>
  <p>Secure login test</p>

  <input id="email" type="email" placeholder="Email address">
  <button onclick="sendLink()">Email me a secure sign-in link</button>

  <div id="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://trujrwhkkjepyorpvjjr.supabase.co";
const SUPABASE_KEY = "sb_publishable_RcP9-stV689diug__RIZkg_g5agpSNR";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function sendLink() {
  const email = document.getElementById("email").value.trim();
  const msg = document.getElementById("msg");

  if (!email) {
    msg.textContent = "Enter your email.";
    return;
  }

  msg.textContent = "Sending...";

  const { error } = await sb.auth.signInWithOtp({
    email,
    options: {
      shouldCreateUser: false,
      emailRedirectTo: "https://asnehpets.github.io/GLOAT-League/wpbl-test.html"
    }
  });

  if (error) {
    msg.textContent = error.message;
  } else {
    msg.textContent = "Check your email for the secure sign-in link.";
  }
}

async function checkSession() {
  const { data } = await sb.auth.getSession();

  if (data.session) {
    document.querySelector(".box").innerHTML =
      "<h1>WPBL</h1><p><b>Secure login worked.</b></p><p>You are signed in.</p>";
  }
}

checkSession();
</script>

</body>
</html>
